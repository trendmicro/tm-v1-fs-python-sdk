name: unittest
on:
  pull_request:
    branches:
      - "main"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Set up every interpreter in the tox.ini envlist. The *last* entry becomes
      # the default `python`, so keep 3.14 last: every step below behaves as
      # before, with only tox reaching for the others.
      - name: Prepare python env
        uses: actions/setup-python@v4
        with:
          python-version: |
            3.13
            3.12
            3.11
            3.14

      # Install uv
      - name: Install uv
        run: pip install uv

      # Pack and publish Python SDK
      - name: Exec py client unit test
        run: make test

      # Exercise tox on every PR instead of only at release time.
      # tox >= 4.31 requires Python >= 3.10, so install it with 3.14, the
      # default `python`.
      - name: Install tox
        run: python3.14 -m pip install tox
      - name: Run tox
        run: python3.14 -m tox
