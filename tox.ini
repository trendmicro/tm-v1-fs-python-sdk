# this file is *not* meant to cover or endorse the use of tox or pytest or
# testing in general,
#
#  It's meant to show the use of:
#
#  - check-manifest
#     confirm items checked into vcs are in your sdist
#  - readme_renderer (when using a ReStructuredText README)
#     confirms your long_description will render correctly on PyPI.
#
#  and also to help confirm pull requests to this project.

[tox]
envlist = py{39,310,311}

# Fail loudly when an interpreter in envlist is missing instead of silently
# skipping that environment. tox <= 4.30 skips by default, tox >= 4.31 fails,
# so pin the behaviour explicitly to keep CI results identical regardless of
# which tox version the runner resolves.
skip_missing_interpreters = false

# Define the minimal tox version required to run;
# if the host tox is less than this the tool with create an environment and
# provision it with a tox that satisfies it under provision_tox_env.
# At least this version is needed for PEP 517/518 support.
minversion = 3.3.0

# Activate isolated build environment. tox will use a virtual environment
# to build a source distribution from the source tree. For build tools and
# arguments use the pyproject.toml file as specified in PEP-517 and PEP-518.
isolated_build = true

[testenv]
deps =
    check-manifest >= 0.42
    # If your project uses README.rst, uncomment the following:
    # readme_renderer
    ruff
    pytest
    build
    twine

allowlist_externals=
    make

commands =
    make -f {toxinidir}/Makefile clean
    ruff check .
    # check-manifest requires setup.py, skipping for pyproject.toml projects
    # check-manifest --ignore 'tox.ini,tests/**,examples/**,docs/**,*.md,Pipfile*,**/scan.proto,venv/**,.venv/**'
    make -f {toxinidir}/Makefile build
    # pytest tests {posargs}
    python -m twine check dist/*
